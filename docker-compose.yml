# The app as one container. It serves plain HTTP on port 8080: put your own HTTPS reverse
# proxy (or tunnel) in front of it for internet access. Setup: README-selfhost.md.
name: vela
services:
  app:
    build: .
    image: vela-selfhost:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
      # true when users reach the app over HTTPS (through your proxy); false for plain-HTTP LAN use.
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - vela-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  vela-data:
