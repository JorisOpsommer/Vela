<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Sign in · Charts</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    </head>
    <body class="auth-page">
        <main class="card">
            <img class="logo" src="/favicon.svg" alt="" width="40" height="40" />
            <h1>Sign in</h1>
            <form id="login" novalidate>
                <label>Username <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
                <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
                <label id="code-row" hidden>Authentication code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" /></label>
                <p class="error" id="error" role="alert" hidden></p>
                <button type="submit">Sign in</button>
            </form>
        </main>
        <script type="module" src="./login.ts"></script>
    </body>
</html>
